# Publica en GitHub Pages sólo las visualizaciones de docs/visualizations/.
# No es CI de la aplicación: no compila ni prueba nada, sólo sirve HTML estático.
# Requiere, una vez: Settings → Pages → Source: «GitHub Actions».
name: Publicar visualizaciones

on:
  push:
    branches: [main]
    paths:
      - "docs/visualizations/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un único despliegue a la vez; no se cancela uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Preparar el sitio
        run: |
          mkdir -p _site
          cp docs/visualizations/*.html _site/
          # La raíz del sitio abre la visualización de las ruedas.
          cp _site/ruedas.html _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
